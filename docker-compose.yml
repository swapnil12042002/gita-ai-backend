version: '3.9'

services:

  postgres:
    image: pgvector/pgvector:pg17

    container_name: gita-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: gita_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest

    container_name: gita-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: